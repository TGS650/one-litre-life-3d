<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>One Litre Life 3D</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #87CEEB;
            font-family: Arial, sans-serif;
        }

        #ui {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 5;
        }

        #petrolBar {
            width: 200px;
            height: 20px;
            background: gray;
            margin-top: 5px;
        }

        #petrolFill {
            width: 100%;
            height: 100%;
            background: green;
        }

        #startBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            font-size: 20px;
            background: black;
            color: white;
            border: none;
            border-radius: 12px;
            z-index: 10;
        }
    </style>
</head>

<body>

<button id="startBtn">START GAME</button>

<div id="ui">
    Distance: <span id="score">0</span>
    <div id="petrolBar">
        <div id="petrolFill"></div>
    </div>
</div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let bike, road;
let petrol = 100;
let distance = 0;
let speed = 0.15;
let gameStarted = false;
let obstacles = [];

init();

function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Light
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 10, 10);
    scene.add(light);

    // Bike
    bike = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 2),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    bike.position.y = 0.5;
    scene.add(bike);

    // Road
    road = new THREE.Mesh(
        new THREE.BoxGeometry(6, 0.1, 1000),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
    );
    road.position.z = 500;
    scene.add(road);

    // Obstacles
    for (let i = 30; i < 500; i += 40) {
        let obs = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshStandardMaterial({ color: 0x0000ff })
        );
        obs.position.set(Math.random() * 4 - 2, 0.5, i);
        scene.add(obs);
        obstacles.push(obs);
    }

    camera.position.set(0, 5, 10);
    camera.lookAt(bike.position);

    animate();
}

// START BUTTON
document.getElementById("startBtn").onclick = () => {
    gameStarted = true;
    document.getElementById("startBtn").style.display = "none";
};

// CONTROLS
document.addEventListener("keydown", e => {
    if (!gameStarted) return;

    if (e.key === "ArrowLeft") bike.position.x -= 0.5;
    if (e.key === "ArrowRight") bike.position.x += 0.5;
});

function animate() {
    requestAnimationFrame(animate);

    if (gameStarted) {
        bike.position.z += speed;
        distance += speed;
        petrol -= 0.02;

        document.getElementById("score").innerText = Math.floor(distance);
        document.getElementById("petrolFill").style.width = petrol + "%";

        obstacles.forEach(o => {
            if (
                Math.abs(o.position.z - bike.position.z) < 1 &&
                Math.abs(o.position.x - bike.position.x) < 1
            ) {
                petrol -= 5;
            }
        });

        if (petrol <= 0) {
            alert("Game Over! Distance: " + Math.floor(distance));
            petrol = 100;
            distance = 0;
            bike.position.set(0, 0.5, 0);
            gameStarted = false;
            document.getElementById("startBtn").style.display = "block";
        }

        camera.position.z = bike.position.z + 10;
        camera.position.x = bike.position.x;
        camera.lookAt(bike.position);
    }

    renderer.render(scene, camera);
}
</script>

</body>
</html>
